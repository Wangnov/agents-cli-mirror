name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate shell syntax
        run: |
          for script in scripts/*.sh install/*.sh; do
            bash -n "$script"
          done
      - run: npm test
